# Releases, automated by release-please - but a release is tagged only once every follower can take it: each
# push to main first lays main's generic files over every base in consumers, cloned from its main, and asks
# the five generic queries of its data (bin/followers-answer.sh). While one does not answer, release-please
# does not run: no release pull request is updated and no tag is made, and a merged release waits, untagged,
# for the first push after which they all answer. (A check on release-please's own pull request cannot do
# this: a pull request opened with GitHub's own token starts no workflow.)
name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  followers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: tad, from its pinned release
        run: TAD_DEST="$HOME/.local/bin" ./bin/install-tad.sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: every follower answers the five queries with main laid over it
        run: |
          git config --global user.name check && git config --global user.email check@localhost
          tad engine >/dev/null
          ./bin/followers-answer.sh now
  release-please:
    needs: followers
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      ikb_created: ${{ steps.rp.outputs['ikb--release_created'] }}
      ikb_tag: ${{ steps.rp.outputs['ikb--tag_name'] }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          # the version comes from the manifest, not from a guess
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  # ikb's release is tagged ikb-vX.Y.Z as a draft; the package conveyor builds the binaries with signed
  # provenance in this same run and says the release once they are all attached.
  binaries:
    needs: release-please
    if: needs.release-please.outputs.ikb_created == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: linux-package-distribution-oco/conveyor/.github/workflows/binaries.yml@v1
    with:
      tag: ${{ needs.release-please.outputs.ikb_tag }}
      declaration: packaging/conveyor.toml
